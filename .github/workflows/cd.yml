name: CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flask-cicd-docker:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name app -p 5000:5000 flask-cicd-docker:${{ github.sha }}

      - name: Wait for container to be ready
        run: sleep 3

      - name: Smoke test the /health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker rm -f app
